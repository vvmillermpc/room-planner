<!doctype html>
<html>
<head><meta charset="utf-8"><title>Loading Mucha layouts…</title></head>
<body style="font: 14px system-ui; padding: 2em; background: #15171c; color: #ddd">
Loading layouts into the planner…
<script>
(async () => {
  const KEY = "room-planner-v4";
  const incoming = await (await fetch("mucha-layouts.json?" + Date.now())).json();
  const raw = localStorage.getItem(KEY);
  if (raw) localStorage.setItem(KEY + "-backup-" + Date.now(), raw);
  const data = raw ? JSON.parse(raw) : { units: "ft", version: 4, rooms: [] };
  const generated = (r) => r.id >= 1790000000000 && r.id < 1790000001000;
  data.rooms = (data.rooms || []).filter((r) => !generated(r)).concat(incoming.rooms);
  const active = incoming.rooms[0];
  Object.assign(data, {
    activeRoomId: active.id, room: active.room, items: active.items, nextId: active.nextId, savedAt: Date.now(),
  });
  localStorage.setItem(KEY, JSON.stringify(data));
  location.replace("index.html" + (location.hash || "#3d"));
})().catch((e) => { document.body.textContent = "Import failed: " + e; });
</script>
</body>
</html>
